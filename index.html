<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>หาสถานีตำรวจเขตอำนาจสอบสวน</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f24;--card:#fff;--bd:#d5d9e0;--ac:#0b5cad;--warn:#8a5a00;--wbg:#fff3d6}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8eaee;--card:#1e232b;--bd:#343b46;--ac:#6cb0ff;--warn:#ffd27a;--wbg:#3a2f12}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Noto Sans Thai",sans-serif}
main{max-width:720px;margin:0 auto}h1{font-size:1.4rem}
form{display:grid;gap:10px}label{display:grid;gap:4px}
input,button{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
button{background:var(--ac);color:var(--bg);border:0;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:12px 0}
.st{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.badge,.warn{background:var(--wbg);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:.95rem}
.warn{display:block;margin:8px 0}
</style></head><body><main>
<h1>หาสถานีตำรวจเขตอำนาจสอบสวน</h1>
<form id="f"><label>ตำบล<input id="t" list="tl" autocomplete="off"></label>
<label>อำเภอ<input id="a" list="al" autocomplete="off"></label>
<button>ค้นหา</button></form>
<datalist id="tl"></datalist><datalist id="al"></datalist>
<div id="out"></div>
<p id="foot"></p>
</main>
<script type="module">
import { findByTambon, normPlace } from './jurisdiction.js';
const [data, admin] = await Promise.all(['jurisdiction.json', 'thai-admin.json'].map(u => fetch(u).then(r => r.json())));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pairs = Object.values(admin).flatMap(d => Object.entries(d));
const fill = (id, list) => { $(id).innerHTML = [...new Set(list)].map(x => `<option value="${esc(x)}">`).join(''); };
const tambons = () => {
  const a = normPlace($('a').value);
  fill('tl', pairs.filter(([n]) => !a || normPlace(n) === a).flatMap(([, t]) => t));
};
fill('al', pairs.map(([a]) => a)); tambons(); $('a').addEventListener('input', tambons);
$('foot').textContent = `ข้อมูลร่างจากแหล่งเปิด (${data.built}) พนักงานสอบสวนต้องตรวจเอง`;
const addr = s => [s.เลขที่, s.หมู่ที่ && 'หมู่ ' + s.หมู่ที่, s.ถนน, s.ตำบล && 'ต.' + s.ตำบล, s.อำเภอ && 'อ.' + s.อำเภอ, s.จังหวัด && 'จ.' + s.จังหวัด, s.รหัสไปรษณีย์].filter(Boolean).join(' ');
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const res = findByTambon(data, { อำเภอ: $('a').value, ตำบล: $('t').value });
  const many = res.length > 1 || res.some(m => m.options.length > 1);
  $('out').innerHTML = !res.length ? '<p class="warn">ไม่พบข้อมูล</p>' :
    (many ? '<span class="warn">ต้องตรวจเลือกเอง</span>' : '') + res.map(m => `<div class="card"><b>จ.${esc(m.จังหวัด)} อ.${esc(m.อำเภอ)} ต.${esc(m.ตำบล)}</b>` +
      (m.level === 'อำเภอ' ? '<span class="warn">ไม่พบตำบลนี้ แสดงทุกสถานีในอำเภอ</span>' : '') +
      m.options.map(({ station: s, share }) => `<div class="st"><b>${esc(s.ชื่อ)} (${esc(s.ย่อ)})</b>${share != null ? ` — ${esc(share)}%` : ''}${s.ประมาณ ? ' <span class="badge">ที่อยู่ประมาณ</span>' : ''}<br>${esc(addr(s))}</div>`).join('') + '</div>').join('');
});
</script></body></html>
